# Required and optional system paths included in service backups.
# shellcheck disable=SC2034
SMB_CONFIG_SOURCE="/etc/samba/smb.conf"
SSH_CONFIG_SOURCE="/etc/ssh/sshd_config"
GRUB_DEFAULT_SOURCE="/etc/default/grub"
MKINITCPIO_SOURCE="/etc/mkinitcpio.conf"
GRUB_THEME_SOURCE="/boot/grub/themes/lateralus"
SAMBA_CONFIG_DIR="/etc/samba"
SAMBA_CREDS_PATTERN="creds-*"

SERVICE_REQUIRED_PATHS=(
  "$SMB_CONFIG_SOURCE"
  "$SSH_CONFIG_SOURCE"
  "$GRUB_DEFAULT_SOURCE"
  "$MKINITCPIO_SOURCE"
)

SERVICE_OPTIONAL_PATHS=(
  "$GRUB_THEME_SOURCE"
)

SAMBA_CREDS_GLOB="$SAMBA_CONFIG_DIR/$SAMBA_CREDS_PATTERN"
