name: Shell CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shell-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Run syntax checks
        run: make syntax

      - name: Run shellcheck
        run: make check

      - name: Run formatting check
        run: make fmt-check
