name: Shell CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shell-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync shellcheck shfmt

      - name: Run local CI checks
        run: make ci-check
