# KDE home folders to include alongside discovered non-hidden folders.
# Missing folders are skipped without failing the backup.
# shellcheck disable=SC2034
HIDDEN_HOME_ITEMS=(
  ".config"
  ".local"
  ".ssh"
  ".themes"
  ".icons"
  ".vscode-oss"
)

# Shell setup files are stored in each ARGUS MAIN backup.
HOME_HIDDEN_FILES=(
  ".bashrc"
  ".profile"
  ".zshrc"
  ".bash_history"
  ".zsh_history"
  ".wget-hsts"
)

DOWNLOADS_EXCLUDES=("*.iso")
SSH_EXCLUDES=("agent/")
